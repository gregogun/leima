name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Skip draft PRs; `ready_for_review` above re-triggers when one is marked ready.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # react-doctor --scope changed needs the base branch

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm types:check

      - name: Dead code
        run: pnpm knip

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: React Doctor (changes vs base branch)
        if: github.event_name == 'pull_request'
        run: pnpm exec react-doctor . --scope changed --base origin/${{ github.base_ref }} --no-score -y
