pre-commit:
  parallel: true
  commands:
    prettier:
      run: pnpm exec prettier --ignore-unknown --write {staged_files}
      stage_fixed: true
    lint:
      glob: '**/*.{ts,tsx,js,jsx,mjs,cjs}'
      run: pnpm exec oxlint --type-aware --max-warnings=0 {staged_files}
    secrets:
      run: node scripts/run-gitleaks-staged.ts
    typecheck:
      run: pnpm types:check
